# FalconBeat — single container: BeatSync (Bun) + ingest (Bun) + Caddy.
#
#   cp .env.example .env   # set FALCONBEAT_TOKEN
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# One published port carries everything — Caddy routes it: devices get the
# page + /ws + /media audio; the plugin reaches /ws, /upload/complete, and
# ingest PUTs through the same port (Bearer-gated). BeatSync :8080 and
# ingest :8090 stay inside the container. BeatSync stores URLs, not bytes;
# audio is pushed to ingest and served from the media volume.
# Keep the plugin's admin WS connected — a room idle >60s is deleted.

services:
  falconbeat:
    # Pulls the CI-built image (GHCR). `docker compose build` still works
    # locally and tags to this same name.
    image: ghcr.io/graphichealer/falconbeat:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    pull_policy: missing
    restart: unless-stopped
    env_file: .env
    # FALCONBEAT_TOKEN — the one shared secret: plugin admin auth (?creator=),
    #   ingest Bearer, /upload/complete gate. Legacy INGEST_TOKEN /
    #   CREATOR_SECRET still work as overrides.
    volumes:
      - ../media:/media        # audio store: ingest writes, Caddy serves
    ports:
      - "8000:80"     # the only port: cloudflared + plugin both point here

  # Optional: cloudflared as a sidecar instead of a host daemon.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN}
  #   depends_on:
  #     - falconbeat

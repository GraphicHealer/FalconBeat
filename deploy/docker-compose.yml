# FalconBeat on the show LAN. cloudflared terminates TLS and points at `web`.
#
#   cp .env.example .env   # set CREATOR_SECRET + INGEST_TOKEN
#   npm --prefix ../web run build
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Audio flow (no S3): FPP plugin PUTs files to ingest (:8090, LAN-only) →
# registers the public URL via POST /upload/complete → Caddy serves
# /media/* to phones through the tunnel. BeatSync stores URLs, not bytes.
# Keep the plugin's admin WS connected — a room idle >60s is deleted.

services:
  beatsync:
    build: ../beatsync
    restart: unless-stopped
    env_file: .env
    # CREATOR_SECRET — admin auth for plugin/bridge (?creator=)
    # No S3_* vars: presigned-upload endpoint is unused; upload/complete
    # only stores the URL. BackupManager will log S3 errors every 60s —
    # harmless noise; silence it later with a stub bucket if it annoys you.
    ports:
      - "8080:8080"   # LAN: plugin admin WS + upload/complete

  ingest:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: node server.ts
    volumes:
      - ../ingest/server.ts:/app/server.ts:ro
      - ../media:/media
    environment:
      PORT: "8090"
      MEDIA_DIR: /media
      INGEST_TOKEN: ${INGEST_TOKEN:?set in .env}
    ports:
      - "8090:8090"   # LAN only — do NOT route this through cloudflared

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ../web/dist:/srv/falconbeat:ro
      - ../media:/srv/media:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8000:80"   # cloudflared ingress target: http://localhost:8000
    depends_on:
      - beatsync

# FalconBeat on the show LAN. cloudflared terminates TLS and points at `web`.
#
#   cp .env.example .env   # set CREATOR_SECRET + S3_* vars
#   npm --prefix ../web run build
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Non-demo mode: the FPP plugin pushes audio via POST /upload/* (S3 presign),
# so the room's source list is dynamic. Keep the plugin's admin WS connected —
# a room with zero clients for 60s is deleted AND its R2 audio purged.

services:
  beatsync:
    build: ../beatsync
    restart: unless-stopped
    env_file: .env
    # LAN admin + plugin access; cloudflared reaches it via `web` (Caddy).
    ports:
      - "8080:8080"

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ../web/dist:/srv/falconbeat:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8000:80"   # cloudflared ingress target: http://localhost:8000
    depends_on:
      - beatsync


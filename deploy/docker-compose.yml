# FalconBeat — single container: BeatSync (Bun) + ingest (Bun) + Caddy.
#
#   cp .env.example .env   # set CREATOR_SECRET + INGEST_TOKEN
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Audio flow (no S3): FPP plugin PUTs files to ingest (:8090, LAN-only) →
# registers the public URL via POST /upload/complete (:8080, LAN-only) →
# Caddy serves /media/* to phones through the tunnel. BeatSync stores
# URLs, not bytes. Keep the plugin's admin WS connected — a room idle
# >60s is deleted.

services:
  falconbeat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    # CREATOR_SECRET — admin auth for plugin/bridge (?creator=), LAN-side
    # INGEST_TOKEN   — Bearer token for PUT /media/*
    volumes:
      - ../media:/media        # audio store: ingest writes, Caddy serves
    ports:
      - "8000:80"     # cloudflared ingress target: http://localhost:8000
      - "8080:8080"   # LAN only: plugin admin WS + upload/complete
      - "8090:8090"   # LAN only: ingest PUTs — never route through cloudflared

  # Optional: cloudflared as a sidecar instead of a host daemon.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN}
  #   depends_on:
  #     - falconbeat

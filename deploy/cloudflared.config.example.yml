# cloudflared tunnel ingress — run on the same LAN host as docker-compose.
# `cloudflared tunnel route dns falconbeat falconbeat.example.com` to bind DNS.
#
# cloudflared proxies WebSocket transparently (no extra config needed).

tunnel: <tunnel-id>
credentials-file: /etc/cloudflared/<tunnel-id>.json

ingress:
  - hostname: falconbeat.example.com
    service: http://localhost:8000   # the `web` (Caddy) container
  - service: http_status:404

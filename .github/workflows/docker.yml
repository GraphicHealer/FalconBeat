name: docker

# Images publish only on version releases — pushes/PRs are covered by ci.yml.
# (No tag-push trigger: the tag is always created alongside the release,
# and firing on both would build the same image twice.)
on:
  release:
    types: [published]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true   # a newer release makes stale builds pointless

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}   # ghcr.io/<owner>/falconbeat

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # beatsync is a pinned submodule — the Dockerfile copies its source,
      # so checkout must pull it. It's a public repo, no extra auth needed.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3   # for arm64 (Pi) builds
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag                                   # v1.2.3
            type=semver,pattern={{version}}                      # 1.2.3
            type=semver,pattern={{major}}.{{minor}}              # 1.2
            type=semver,pattern={{major}}                        # 1
            type=raw,value=latest                                # releases are latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ github.event.release.tag_name }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
